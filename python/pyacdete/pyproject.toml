[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyacdete"
version = "0.1.2"
description = "Python Acoustic Device Testing: loudspeaker H1 response, single-tone THD, and delay"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "matplotlib>=3.7,<4"]

[project.optional-dependencies]
smard = ["soundfile>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["pyacdete*"]
